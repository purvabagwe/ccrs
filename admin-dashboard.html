<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - College Complaint System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            /* A slightly different gray for the admin area */
        }

        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Style for the modal backdrop */
        .modal-backdrop {
            background-color: rgba(0, 0, 0, 0.5);
            transition: opacity 0.3s ease;
        }
    </style>
</head>

<body class="antialiased">

    <!-- Header Section -->
    <header class="bg-white shadow-md rounded-b-xl sticky top-0 z-40">
        <div class="container mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="text-3xl">🛡️</span>
                <div>
                    <h1 class="text-2xl md:text-3xl font-bold text-gray-800">Admin Dashboard</h1>
                    <span id="admin-email-tag" class="text-xs text-gray-500 font-medium">Logged in as Administrator</span>
                </div>
            </div>
            <nav class="flex items-center space-x-4">
                <a href="index.html" class="text-gray-600 font-medium hover:text-blue-500 transition-colors">Home</a>
                <button id="logout-btn"
                    class="bg-red-500 text-white px-4 py-2 rounded-md font-medium hover:bg-red-600 transition-colors">Logout</button>
            </nav>
        </div>
    </header>

    <main class="container mx-auto px-6 py-8">
        <!-- Toast Notification Container -->
        <div id="toast-message" class="hidden mb-6 p-4 rounded-lg text-sm font-medium transition-all"></div>

        <!-- Statistics Cards -->
        <section id="stats-cards" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
            <!-- Cards will be injected by JS -->
        </section>

        <!-- Complaints Management Table -->
        <section class="bg-white p-6 rounded-xl shadow-md">
            <div class="flex flex-col sm:flex-row justify-between items-center mb-4">
                <div class="flex items-center space-x-3 mb-4 sm:mb-0">
                    <h2 class="text-2xl font-bold text-gray-800">Manage Complaints</h2>
                    <button onclick="loadComplaints()" class="text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1 rounded-md transition flex items-center gap-1">
                        🔄 Refresh
                    </button>
                </div>
                <div class="flex items-center space-x-2">
                    <label for="filterStatus" class="text-sm font-medium text-gray-600">Filter by status:</label>
                    <select id="filterStatus"
                        class="rounded-md border border-gray-300 px-3 py-1.5 shadow-sm focus:border-blue-500 focus:ring-blue-500 transition">
                        <option value="All">All</option>
                        <option value="Pending">Pending</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Resolved">Resolved</option>
                    </select>
                </div>
            </div>

            <!-- Table for complaints -->
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Complaint ID</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Title</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Category</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Date</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Status</th>
                            <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Action</th>
                        </tr>
                    </thead>
                    <tbody id="complaints-table-body" class="bg-white divide-y divide-gray-200">
                        <!-- Rows will be injected by JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Modal for Viewing/Updating Complaint -->
    <div id="complaint-modal" class="fixed inset-0 z-50 flex items-center justify-center hidden modal-backdrop">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg mx-4 max-h-[90vh] overflow-y-auto">
            <div class="p-6">
                <div class="flex justify-between items-start mb-4">
                    <h3 class="text-2xl font-bold text-gray-800" id="modal-title">Complaint Details</h3>
                    <button onclick="closeModal()"
                        class="text-gray-400 hover:text-gray-600 text-3xl leading-none">&times;</button>
                </div>
                <div id="modal-body" class="space-y-4">
                    <!-- Modal content will be injected by JS -->
                </div>
            </div>
            <div class="bg-gray-50 px-6 py-4 flex justify-between items-center rounded-b-xl">
                <button id="delete-complaint-btn"
                    class="bg-red-50 text-red-600 border border-red-200 px-4 py-2 rounded-md font-medium hover:bg-red-100 transition-colors">
                    Delete
                </button>
                <div class="flex space-x-3">
                    <button onclick="closeModal()"
                        class="bg-gray-200 text-gray-700 px-4 py-2 rounded-md font-medium hover:bg-gray-300 transition-colors">Cancel</button>
                    <button id="save-status-btn"
                        class="bg-blue-600 text-white px-4 py-2 rounded-md font-medium hover:bg-blue-700 transition-colors">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Store for complaints fetched from the backend API
        let allComplaints = [];

        // DOM Elements
        const complaintsTableBody = document.getElementById('complaints-table-body');
        const filterStatus = document.getElementById('filterStatus');
        const modal = document.getElementById('complaint-modal');
        const modalBody = document.getElementById('modal-body');
        const modalTitle = document.getElementById('modal-title');
        const saveStatusBtn = document.getElementById('save-status-btn');
        const deleteComplaintBtn = document.getElementById('delete-complaint-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const toastMessage = document.getElementById('toast-message');
        const adminEmailTag = document.getElementById('admin-email-tag');

        // Toast feedback helper
        function showToast(text, isError = false) {
            toastMessage.textContent = text;
            toastMessage.className = isError 
                ? 'mb-6 p-4 rounded-lg text-sm font-medium bg-red-100 text-red-800 border border-red-200 block'
                : 'mb-6 p-4 rounded-lg text-sm font-medium bg-green-100 text-green-800 border border-green-200 block';
            setTimeout(() => {
                toastMessage.className = 'hidden';
            }, 4000);
        }

        // --- UTILITY FUNCTIONS ---
        const getStatusBadge = (status) => {
            switch (status) {
                case 'Pending': return `<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-yellow-100 text-yellow-800">${status}</span>`;
                case 'In Progress': return `<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-blue-100 text-blue-800">${status}</span>`;
                case 'Resolved': return `<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">${status}</span>`;
                default: return `<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-gray-100 text-gray-800">${status}</span>`;
            }
        };

        const getStatsCard = (title, value, icon, color) => `
            <div class="bg-white p-6 rounded-xl shadow-md flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-gray-500">${title}</p>
                    <p class="text-3xl font-bold text-gray-800">${value}</p>
                </div>
                <div class="w-12 h-12 flex items-center justify-center rounded-full ${color}">
                    <span class="text-2xl">${icon}</span>
                </div>
            </div>
        `;

        // --- RENDER FUNCTIONS ---
        const renderTable = (complaints) => {
            complaintsTableBody.innerHTML = '';
            if (!complaints || complaints.length === 0) {
                complaintsTableBody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-gray-500">No complaints found.</td></tr>`;
                return;
            }
            complaints.forEach(c => {
                const id = c.complaintId || c.id;
                const formattedDate = c.createdAt ? new Date(c.createdAt).toLocaleDateString() : (c.date || 'N/A');
                const row = `
                    <tr class="hover:bg-gray-50 transition-colors">
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-semibold text-blue-600">${id}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-800 font-medium">${c.title}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">${c.category}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${formattedDate}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm">${getStatusBadge(c.status)}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                            <button onclick="openModal('${id}')" class="text-blue-600 hover:text-blue-900 font-medium">View / Update</button>
                        </td>
                    </tr>
                `;
                complaintsTableBody.innerHTML += row;
            });
        };

        const renderStats = () => {
            const total = allComplaints.length;
            const pending = allComplaints.filter(c => c.status === 'Pending').length;
            const inProgress = allComplaints.filter(c => c.status === 'In Progress').length;
            const resolved = allComplaints.filter(c => c.status === 'Resolved').length;

            const statsContainer = document.getElementById('stats-cards');
            statsContainer.innerHTML = getStatsCard('Total Complaints', total, '📊', 'bg-blue-100 text-blue-600') +
                getStatsCard('Pending', pending, '⏳', 'bg-yellow-100 text-yellow-600') +
                getStatsCard('In Progress', inProgress, '⚙️', 'bg-indigo-100 text-indigo-600') +
                getStatsCard('Resolved', resolved, '✅', 'bg-green-100 text-green-600');
        };

        // --- FETCH COMPLAINTS FROM BACKEND ---
        async function loadComplaints() {
            try {
                const response = await fetch('/api/complaints');
                if (response.ok) {
                    allComplaints = await response.json();
                    handleFilter();
                    renderStats();
                } else {
                    showToast('Failed to load complaints from server.', true);
                }
            } catch (err) {
                console.error('Error fetching complaints:', err);
                showToast('Network error while loading complaints.', true);
            }
        }

        // --- EVENT HANDLERS ---
        const handleFilter = () => {
            const status = filterStatus.value;
            const filteredComplaints = status === 'All'
                ? allComplaints
                : allComplaints.filter(c => c.status === status);
            renderTable(filteredComplaints);
        };

        window.openModal = (complaintId) => {
            const complaint = allComplaints.find(c => (c.complaintId || c.id) === complaintId);
            if (!complaint) return;

            const complaintDate = complaint.createdAt ? new Date(complaint.createdAt).toLocaleString() : 'N/A';
            modalTitle.textContent = `Details for ${complaint.complaintId || complaint.id}`;
            modalBody.innerHTML = `
                <p><strong class="font-semibold text-gray-700 w-28 inline-block">Title:</strong> ${complaint.title}</p>
                <p><strong class="font-semibold text-gray-700 w-28 inline-block">Category:</strong> ${complaint.category}</p>
                <p><strong class="font-semibold text-gray-700 w-28 inline-block">Date:</strong> ${complaintDate}</p>
                <div>
                    <strong class="font-semibold text-gray-700 w-28 block mb-1">Description:</strong>
                    <p class="bg-gray-50 p-3 rounded-md text-gray-700 border border-gray-100 leading-relaxed">${complaint.description}</p>
                </div>
                <div class="flex items-center space-x-2 pt-2">
                    <label for="modal-status" class="font-semibold text-gray-700">Update Status:</label>
                    <select id="modal-status" class="w-full rounded-md border border-gray-300 p-2 shadow-sm focus:border-blue-500 focus:ring-blue-500 transition">
                        <option value="Pending" ${complaint.status === 'Pending' ? 'selected' : ''}>Pending</option>
                        <option value="In Progress" ${complaint.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                        <option value="Resolved" ${complaint.status === 'Resolved' ? 'selected' : ''}>Resolved</option>
                    </select>
                </div>
            `;
            saveStatusBtn.dataset.complaintId = complaint.complaintId || complaint.id;
            deleteComplaintBtn.dataset.complaintId = complaint.complaintId || complaint.id;
            modal.classList.remove('hidden');
        };

        window.closeModal = () => {
            modal.classList.add('hidden');
        };

        const saveStatus = async () => {
            const complaintId = saveStatusBtn.dataset.complaintId;
            const newStatus = document.getElementById('modal-status').value;

            try {
                const response = await fetch(`/api/complaints/${complaintId}/status`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });

                if (response.ok) {
                    showToast(`Complaint ${complaintId} status updated to ${newStatus}`);
                    await loadComplaints();
                    closeModal();
                } else {
                    const data = await response.json();
                    alert(data.error || 'Failed to update status');
                }
            } catch (err) {
                console.error('Error updating status:', err);
                alert('Network error while updating status');
            }
        };

        const deleteComplaint = async () => {
            const complaintId = deleteComplaintBtn.dataset.complaintId;
            if (!confirm(`Are you sure you want to permanently delete complaint ${complaintId}?`)) {
                return;
            }

            try {
                const response = await fetch(`/api/complaints/${complaintId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    showToast(`Complaint ${complaintId} deleted successfully`);
                    await loadComplaints();
                    closeModal();
                } else {
                    const data = await response.json();
                    alert(data.error || 'Failed to delete complaint');
                }
            } catch (err) {
                console.error('Error deleting complaint:', err);
                alert('Network error while deleting complaint');
            }
        };

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            // Check session
            const adminUser = sessionStorage.getItem('adminUser');
            if (adminUser) {
                try {
                    const parsed = JSON.parse(adminUser);
                    if (parsed.email) {
                        adminEmailTag.textContent = `Logged in: ${parsed.email}`;
                    }
                } catch (e) {}
            }

            // Load live complaints from backend
            loadComplaints();

            // Set up event listeners
            filterStatus.addEventListener('change', handleFilter);
            saveStatusBtn.addEventListener('click', saveStatus);
            deleteComplaintBtn.addEventListener('click', deleteComplaint);
            logoutBtn.addEventListener('click', () => {
                sessionStorage.removeItem('adminUser');
                window.location.href = 'index.html';
            });

            // Allow closing the modal with the Escape key
            window.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && !modal.classList.contains('hidden')) {
                    closeModal();
                }
            });
        });
    </script>
</body>

</html>
