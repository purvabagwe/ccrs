<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - College Complaint Report System</title>

    <!-- Use Inter font from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #ffffff;
            --secondary-color: #f8f9fa;
            --accent-color: #4a89f3;
            --text-color: #34495e;
            --input-bg: #f0f2f5;
            --border-color: #e0e6ed;
            --success-color: #28a745;
            --error-color: #dc3545;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #e0eaf4, #f0f4f8);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 1rem;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .login-card {
            background-color: var(--primary-color);
            padding: 2.5rem;
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-header {
            margin-bottom: 2rem;
        }

        .login-header h2 {
            font-size: 2.25rem;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 0.5rem;
        }

        .login-header p {
            font-size: 1rem;
            color: #888;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 0.5rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            background-color: var(--input-bg);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(74, 137, 243, 0.2);
        }

        .submit-button {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--accent-color);
            color: var(--primary-color);
            border: none;
            border-radius: 0.75rem;
            font-size: 1.125rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .submit-button:hover {
            background-color: #3871d8;
            transform: translateY(-2px);
        }

        .message-container {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 0.75rem;
            font-weight: 500;
            text-align: center;
            display: none;
            /* Hidden by default */
        }

        .message-container.hidden {
            display: none;
        }

        .message.success {
            background-color: rgba(40, 167, 69, 0.1);
            color: var(--success-color);
            border: 1px solid rgba(40, 167, 69, 0.2);
        }

        .message.error {
            background-color: rgba(220, 53, 69, 0.1);
            color: var(--error-color);
            border: 1px solid rgba(220, 53, 69, 0.2);
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="login-header">
            <h2>Admin Login</h2>
            <p>Enter your credentials to access the admin dashboard.</p>
        </div>
        <form id="adminLoginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">Email</label>
                <input type="email" id="email" name="email" placeholder="admin@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Password" required>
            </div>
            <button type="submit" class="submit-button">Log In</button>
        </form>
        <div id="messageContainer" class="message-container hidden">
            <p id="message" class="message"></p>
        </div>
        <div style="margin-top: 1.5rem; font-size: 0.875rem;">
            <a href="index.html" style="color: var(--accent-color); text-decoration: none; font-weight: 600;">← Back to Home</a>
        </div>
    </div>
    <script>
        async function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const messageContainer = document.getElementById('messageContainer');
            const message = document.getElementById('message');

            try {
                const response = await fetch('https://ccrs-hfw7.onrender.com/api/admin/signin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    message.textContent = data.message || 'Login successful!';
                    message.className = 'message success';
                    messageContainer.style.display = 'block';

                    // Save admin session
                    sessionStorage.setItem('adminUser', JSON.stringify(data.admin || { email }));

                    // Redirect to admin dashboard
                    setTimeout(() => {
                        window.location.href = 'admin-dashboard.html';
                    }, 1000);
                } else {
                    message.textContent = data.error || 'Invalid credentials';
                    message.className = 'message error';
                    messageContainer.style.display = 'block';
                }
            } catch (error) {
                message.textContent = 'An error occurred. Please try again later.';
                message.className = 'message error';
                messageContainer.style.display = 'block';
                console.error('Admin login error:', error);
            }
        }
    </script>
</body>

</html>
