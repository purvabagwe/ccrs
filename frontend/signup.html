<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sign Up - College Complaint Report System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        input {
            font-size: 16px !important;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-slate-100 via-blue-50/60 to-indigo-100 text-slate-800 antialiased min-h-screen flex flex-col justify-center items-center p-4 sm:p-6 lg:p-8">

    <div class="w-full max-w-lg my-auto">
        <!-- Back Link -->
        <div class="mb-4">
            <a href="index.html" class="inline-flex items-center gap-1.5 text-xs sm:text-sm font-semibold text-slate-600 hover:text-blue-600 transition-colors p-1 rounded-lg">
                ← Back to Home
            </a>
        </div>

        <!-- Auth Card -->
        <div class="bg-white/95 backdrop-blur-xl rounded-2xl sm:rounded-3xl shadow-2xl shadow-blue-900/10 border border-white/60 p-6 sm:p-10">
            <!-- Header -->
            <div class="text-center mb-6 sm:mb-8">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-blue-600 text-white text-2xl mb-3 shadow-lg shadow-blue-500/30">
                    ✍️
                </div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">Create an Account</h1>
                <p class="text-xs sm:text-sm text-slate-500 mt-1.5">
                    Register to lodge, manage, and track complaints
                </p>
            </div>

            <!-- Feedback Alert -->
            <div id="messageContainer" class="hidden mb-5 p-3.5 rounded-xl text-xs sm:text-sm font-medium border transition-all">
                <p id="message"></p>
            </div>

            <!-- Form -->
            <form id="signUpForm" class="space-y-4 sm:space-y-4">
                <!-- Name Row (1 col on mobile, 2 cols on tablet/desktop) -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 sm:gap-4">
                    <div>
                        <label for="firstName" class="block text-xs sm:text-sm font-semibold text-slate-700 mb-1.5">
                            First Name <span class="text-red-500">*</span>
                        </label>
                        <input type="text" id="firstName" name="firstName" required
                            placeholder="John"
                            autocomplete="given-name"
                            class="w-full px-4 py-3 sm:py-3.5 rounded-xl border border-slate-200 bg-slate-50/60 text-slate-900 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
                    </div>
                    <div>
                        <label for="lastName" class="block text-xs sm:text-sm font-semibold text-slate-700 mb-1.5">
                            Last Name <span class="text-red-500">*</span>
                        </label>
                        <input type="text" id="lastName" name="lastName" required
                            placeholder="Doe"
                            autocomplete="family-name"
                            class="w-full px-4 py-3 sm:py-3.5 rounded-xl border border-slate-200 bg-slate-50/60 text-slate-900 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
                    </div>
                </div>

                <!-- Email -->
                <div>
                    <label for="email" class="block text-xs sm:text-sm font-semibold text-slate-700 mb-1.5">
                        College / Personal Email <span class="text-red-500">*</span>
                    </label>
                    <div class="relative">
                        <input type="email" id="email" name="email" required
                            placeholder="student@college.edu"
                            autocomplete="email"
                            class="w-full pl-10 pr-4 py-3 sm:py-3.5 rounded-xl border border-slate-200 bg-slate-50/60 text-slate-900 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 text-sm">
                            ✉️
                        </span>
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <label for="password" class="block text-xs sm:text-sm font-semibold text-slate-700 mb-1.5">
                        Create Password <span class="text-red-500">*</span>
                    </label>
                    <div class="relative">
                        <input type="password" id="password" name="password" required minlength="6"
                            placeholder="At least 6 characters"
                            autocomplete="new-password"
                            class="w-full pl-10 pr-11 py-3 sm:py-3.5 rounded-xl border border-slate-200 bg-slate-50/60 text-slate-900 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 text-sm">
                            🔒
                        </span>
                        <!-- Password Visibility Toggle -->
                        <button type="button" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility"
                            class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none">
                            <span id="eyeIcon">👁️</span>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn"
                    class="w-full flex items-center justify-center gap-2 py-3.5 sm:py-4 px-6 rounded-xl font-bold text-white bg-blue-600 hover:bg-blue-700 active:scale-[0.99] shadow-lg shadow-blue-500/25 transition-all text-base sm:text-lg cursor-pointer mt-3">
                    <span id="btnText">Complete Registration</span>
                    <span id="btnSpinner" class="hidden">
                        <svg class="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                        </svg>
                    </span>
                </button>
            </form>

            <!-- Links -->
            <div class="mt-6 pt-5 border-t border-slate-100 text-center">
                <p class="text-xs sm:text-sm text-slate-600">
                    Already have an account? <a href="signin.html" class="font-bold text-blue-600 hover:underline">Sign In here</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.textContent = '🙈';
            } else {
                passwordInput.type = 'password';
                eyeIcon.textContent = '👁️';
            }
        }

        document.getElementById('signUpForm').addEventListener('submit', handleFormSubmission);

        async function handleFormSubmission(event) {
            event.preventDefault();

            const form = event.target;
            const firstName = form.firstName.value.trim();
            const lastName = form.lastName.value.trim();
            const email = form.email.value.trim();
            const password = form.password.value;

            const messageContainer = document.getElementById('messageContainer');
            const message = document.getElementById('message');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');

            submitBtn.disabled = true;
            btnText.textContent = 'Registering...';
            btnSpinner.classList.remove('hidden');
            messageContainer.classList.add('hidden');

            try {
                const response = await fetch('https://ccrs-hfw7.onrender.com/api/users/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ firstName, lastName, email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    message.textContent = data.message || 'Account created successfully! Redirecting to Sign In...';
                    messageContainer.className = 'mb-5 p-3.5 rounded-xl text-xs sm:text-sm font-medium bg-emerald-50 text-emerald-700 border border-emerald-200 block';
                    form.reset();

                    setTimeout(() => {
                        window.location.href = 'signin.html';
                    }, 1200);
                } else {
                    message.textContent = data.error || 'Failed to create account. Please try again.';
                    messageContainer.className = 'mb-5 p-3.5 rounded-xl text-xs sm:text-sm font-medium bg-red-50 text-red-700 border border-red-200 block';
                }
            } catch (error) {
                console.error('Sign-up error:', error);
                message.textContent = 'Network error. Please check if the server is active.';
                messageContainer.className = 'mb-5 p-3.5 rounded-xl text-xs sm:text-sm font-medium bg-red-50 text-red-700 border border-red-200 block';
            } finally {
                submitBtn.disabled = false;
                btnText.textContent = 'Complete Registration';
                btnSpinner.classList.add('hidden');
            }
        }
    </script>
</body>

</html>
